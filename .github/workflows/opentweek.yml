name: OpenTweek
on:
  push:
    paths: ['opentweek/**', '.github/workflows/opentweek.yml']
  pull_request:
    paths: ['opentweek/**', '.github/workflows/opentweek.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentweek
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opentweek/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: ./android/test.sh
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opentweek-local-debug
          path: |
            opentweek/android/build-local/*-local-debug.apk
            opentweek/android/build-local/*-local-debug.apk.sha256
          retention-days: 14
