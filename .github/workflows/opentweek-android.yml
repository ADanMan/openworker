name: opentweek Android APK

on:
  push:
    paths:
      - 'opentweek/**'
      - '.github/workflows/opentweek-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentweek
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opentweek/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: opentweek/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk ../../out/opentweek-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: opentweek-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opentweek-v0.1.${{ github.run_number }}
          name: opentweek 0.1.${{ github.run_number }} (Android)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: out/*.apk
          body: |
            Android APK of opentweek, built from ${{ github.sha }}.
            On your phone: download the `.apk`, open it, and allow "Install unknown apps" for your browser when asked.
            Newer builds install over older ones and keep your data.
